<!DOCTYPE html>
<html lang="en">
<head>

<title>~/kenziy — OWASP API Security Top 10:2023 Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d1117; --surface:#161b22; --border:#21262d; --border2:#30363d; --green:#3fb950; --green2:rgba(63,185,80,0.12); --green-glow:0 0 8px rgba(63,185,80,0); --red:#ff3333; --yellow:#ffcc00; --cyan:#00e5ff; --gray:#444444; --text:#e6edf3; --text-dim:#8b949e; --mono:'IBM Plex Mono','Consolas','Menlo','Courier New',monospace; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.6; min-height: 100vh; }
  .navbar { border-bottom: 1px solid var(--border2); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--bg); position: sticky; top: 0; z-index: 200; }
  .nav-brand { color: var(--green); font-size: 15px; text-decoration: none; text-shadow: var(--green-glow); }
  .nav-brand .dim { color: var(--text-dim); }
  .nav-links { display: flex; gap: 18px; list-style: none; flex-wrap: wrap; }
  .nav-links a { color: var(--text-dim); text-decoration: none; font-size: 12px; transition: color 0.12s; }
  .nav-links a:hover { color: var(--green); }
  .header { padding: 24px 24px 18px; border-bottom: 1px solid var(--border2); }
  .header-path { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
  .header-path .hl { color: var(--green); }
  .header-title { font-size: clamp(15px, 3.5vw, 22px); color: var(--green); text-shadow: var(--green-glow); margin-bottom: 4px; }
  .header-title .prompt { color: var(--text-dim); }
  .header-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 18px; }
  .header-sub a { color: var(--cyan); text-decoration: none; }
  .header-sub a:hover { text-decoration: underline; }
  .progress-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .progress-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .progress-label strong { color: var(--green); font-size: 16px; text-shadow: var(--green-glow); }
  .progress-track { flex: 1; min-width: 100px; max-width: 280px; height: 4px; background: var(--border2); }
  .progress-fill { height: 100%; background: var(--green); box-shadow: var(--green-glow); transition: width 0.3s ease; }
  .progress-pct { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .cursor { display: inline-block; width: 9px; height: 15px; background: var(--green); vertical-align: middle; margin-left: 3px; animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .controls { padding: 10px 24px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border2); }
  .target-input { font-family: var(--mono); font-size: 12px; padding: 5px 10px; background: var(--surface); border: 1px solid var(--border2); color: var(--green); outline: none; width: clamp(140px, 30vw, 240px); caret-color: var(--green); transition: border-color 0.12s; }
  .target-input::placeholder { color: var(--text-dim); }
  .target-input:focus { border-color: var(--green); }
  .sep { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }
  .btn { font-family: var(--mono); font-size: 11px; padding: 5px 11px; background: transparent; border: 1px solid var(--border2); color: var(--text-dim); cursor: pointer; letter-spacing: 0.3px; transition: all 0.12s; white-space: nowrap; }
  .btn:hover { border-color: var(--green); color: var(--green); }
  .btn.active { border-color: var(--green); color: var(--green); background: var(--green2); }
  .btn.danger { color: var(--red); border-color: rgba(255,51,51,0.2); }
  .btn.danger:hover { background: rgba(255,51,51,0.07); border-color: var(--red); }
  .main { padding: 18px 24px 64px; max-width: 960px; margin: 0 auto; }
  .category { margin-bottom: 14px; border: 1px solid var(--border2); }
  .cat-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); cursor: pointer; user-select: none; transition: background 0.1s; flex-wrap: nowrap; overflow: hidden; }
  .cat-header:hover { background: #1c2128; }
  .cat-prompt { color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
  .cat-id { color: var(--green); font-size: 12px; flex-shrink: 0; text-shadow: var(--green-glow); }
  .cat-title { font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-stats { font-size: 11px; color: var(--text-dim); flex-shrink: 0; margin-left: 8px; }
  .cat-stats .done { color: var(--green); }
  .cat-chevron { color: var(--text-dim); font-size: 10px; transition: transform 0.16s; flex-shrink: 0; }
  .category.collapsed .cat-chevron { transform: rotate(-90deg); }
  .category.collapsed .cat-body { display: none; }
  .cat-desc { padding: 8px 14px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.5); line-height: 1.7; }
  .cat-desc::before { content: '# '; color: var(--border2); }
  .test-item { display: grid; grid-template-columns: 3px 18px 1fr; gap: 0 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.08s; align-items: start; }
  .test-item:last-child { border-bottom: none; }
  .test-item:hover { background: rgba(63,185,80,0.025); }
  .test-item.done { background: rgba(63,185,80,0.015); }
  .test-item.done .test-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: rgba(63,185,80,0.2); }
  .test-item.done .test-detail { opacity: 0.38; }
  .sev-bar { align-self: stretch; min-height: 16px; }
  .s-high { background: var(--red); box-shadow: 0 0 5px rgba(255,51,51,0.4); }
  .s-med { background: var(--yellow); box-shadow: 0 0 5px rgba(255,204,0,0.35); }
  .s-low { background: var(--cyan); box-shadow: 0 0 5px rgba(0,229,255,0.3); }
  .s-info { background: var(--gray); }
  .check-box { width: 14px; height: 14px; border: 1px solid var(--gray); display: flex; align-items: center; justify-content: center; margin-top: 2px; flex-shrink: 0; transition: all 0.12s; }
  .test-item:hover .check-box { border-color: var(--green); }
  .test-item.done .check-box { background: var(--green); border-color: var(--green); box-shadow: var(--green-glow); }
  .check-box svg { display: none; }
  .test-item.done .check-box svg { display: block; }
  .test-content { min-width: 0; }
  .test-name { font-size: 13px; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
  .test-name::before { content: '> '; color: var(--text-dim); }
  .test-detail { font-size: 11px; color: var(--text-dim); line-height: 1.65; margin-bottom: 6px; }
  .test-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 9px; padding: 2px 6px; border: 1px solid; letter-spacing: 0.5px; text-transform: uppercase; }
  .t-high { color: var(--red); border-color: rgba(255,51,51,0.3); background: rgba(255,51,51,0.05); }
  .t-med { color: var(--yellow); border-color: rgba(255,204,0,0.3); background: rgba(255,204,0,0.04); }
  .t-low { color: var(--cyan); border-color: rgba(0,229,255,0.25); background: rgba(0,229,255,0.04); }
  .t-tool { color: var(--green); border-color: rgba(63,185,80,0.2); background: rgba(63,185,80,0.04); }
  .t-cwe { color: #8b949e; border-color: rgba(100,100,100,0.2); background: transparent; }
  footer { text-align: center; padding: 18px 24px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border2); }
  footer a { color: var(--green); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  @media (max-width: 600px) { .navbar{padding:10px 14px} .header{padding:16px 14px 14px} .controls{padding:8px 14px} .main{padding:12px 14px 52px} .cat-header{padding:9px 12px;gap:6px} .cat-desc{padding:7px 12px} .test-item{padding:9px 12px;gap:0 10px} .test-name{font-size:12px} .btn{font-size:10px;padding:5px 8px} .target-input{width:100%} .sep{display:none} .progress-track{min-width:70px} .nav-links{gap:10px} }
  @media (max-width: 380px) { .nav-links{display:none} .header-title{font-size:13px} .cat-title{font-size:12px} }
</style>
</head>

    source: <a href="https://owasp.org/API-Security/" target="_blank">owasp.org/API-Security/</a>

  <div class="progress-wrap">

<script>
const CATS = [
  { id:"API1:2023", title:"Broken Object Level Authorization",
    desc:"APIs exposing endpoints that handle object identifiers create a wide attack surface for Object Level Access Control issues. Authorization checks should be performed in every function that accesses a data source using input from the user.",
    tests:[
      {n:"IDOR via Numeric/UUID IDs",d:"Modify object IDs in API requests (e.g., /api/users/123 to /api/users/124) to access resources belonging to other users without authorization.",s:"high",t:["Burp Suite","Postman"],c:["CWE-639"]},
      {n:"Horizontal Privilege Escalation Across Tenants",d:"In multi-tenant APIs, test if manipulating tenant identifiers allows access to another organization's data by changing tenant IDs, subdomain parameters, or headers.",s:"high",t:["Burp Suite","Postman"],c:["CWE-284"]},
      {n:"Object Reference Manipulation in Nested Resources",d:"Test nested resource endpoints (e.g., /orgs/1/users/2/documents/3) by mixing IDs from different parent resources to access unauthorized nested objects.",s:"high",t:["Burp Suite","Postman"],c:["CWE-639"]},
      {n:"GraphQL Node ID Enumeration",d:"In GraphQL APIs, test node/relay-style global IDs to access objects across types by decoding and modifying base64 node identifiers.",s:"high",t:["GraphQL Voyager","Burp Suite"],c:["CWE-639"]},
      {n:"Bulk Operation Authorization Bypass",d:"Test batch/bulk endpoints to check if authorization is validated per-item or only on the batch request, allowing unauthorized items in bulk operations.",s:"high",t:["Burp Suite","Postman"],c:["CWE-284"]},
      {n:"Resource Ownership Validation",d:"Test if the API properly validates that the authenticated user owns the resource being accessed, modified, or deleted across all CRUD operations.",s:"high",t:["Burp Suite","Postman"],c:["CWE-639"]}
    ]
  },
  { id:"API2:2023", title:"Broken Authentication",
    desc:"Authentication mechanisms are complex and often implemented incorrectly. Attackers exploit vulnerabilities in authentication tokens, implementation flaws, or by brute-forcing credentials.",
    tests:[
      {n:"JWT None Algorithm Attack",d:"Modify the JWT header to use alg:none and strip the signature to bypass token verification. Test with empty signature and various none variants.",s:"high",t:["jwt_tool","Burp Suite"],c:["CWE-345"]},
      {n:"Brute Force on API Login Endpoints",d:"Test API login endpoints for rate limiting absence. Attempt credential stuffing with common password lists to verify brute force protections.",s:"high",t:["Burp Suite","FFUF","Hydra"],c:["CWE-307"]},
      {n:"API Key Leakage in URLs/Headers",d:"Check if API keys are transmitted in URL query parameters (logged in server logs, proxies, browser history) rather than secure headers.",s:"med",t:["Burp Suite","curl"],c:["CWE-598"]},
      {n:"OAuth2 Token Theft/Replay",d:"Test for OAuth2 vulnerabilities: token leakage via redirect_uri manipulation, missing state parameter, token replay after expiry, and refresh token abuse.",s:"high",t:["Burp Suite","Postman"],c:["CWE-294"]},
      {n:"Weak Token Entropy Analysis",d:"Collect multiple API tokens and analyze for predictability, sequential patterns, or insufficient entropy using statistical analysis tools.",s:"high",t:["Burp Sequencer","custom scripts"],c:["CWE-330"]},
      {n:"Missing Rate Limiting on Auth Endpoints",d:"Test login, password reset, OTP verification, and token refresh endpoints for absence of rate limiting or account lockout mechanisms.",s:"high",t:["Burp Suite","FFUF"],c:["CWE-307"]},
      {n:"Password Reset Token Predictability",d:"Request multiple password reset tokens and analyze for predictable patterns, short expiry enforcement, and single-use validation.",s:"high",t:["Burp Suite","Postman"],c:["CWE-640"]}
    ]
  },
  { id:"API3:2023", title:"Broken Object Property Level Authorization",
    desc:"APIs may expose object properties that the user should not be authorized to access or modify, leading to data exposure or unauthorized modification.",
    tests:[
      {n:"Mass Assignment via Extra JSON Properties",d:"Submit additional JSON properties not in the UI (isAdmin:true, role:admin, price:0) to test if the API blindly binds request data to internal objects.",s:"high",t:["Burp Suite","Postman","Arjun"],c:["CWE-915"]},
      {n:"Excessive Data Exposure in Responses",d:"Analyze API responses for sensitive fields returned but not displayed in the UI: internal IDs, email addresses, hashed passwords, PII, or debug data.",s:"high",t:["Burp Suite","Postman"],c:["CWE-213"]},
      {n:"Hidden Field Manipulation",d:"Identify hidden or internal fields from API documentation, error messages, or response objects and attempt to set them in create/update requests.",s:"high",t:["Burp Suite","Arjun"],c:["CWE-915"]},
      {n:"GraphQL Field-Level Authorization",d:"Query GraphQL endpoints for fields that should be restricted based on the authenticated user's role. Test if sensitive fields are accessible via introspection.",s:"high",t:["GraphQL Voyager","Burp Suite"],c:["CWE-284"]},
      {n:"Response Filtering Bypass",d:"Test if client-side filtering can be bypassed by requesting raw API endpoints directly, accessing verbose response formats, or using different Accept headers.",s:"med",t:["Burp Suite","curl"],c:["CWE-213"]},
      {n:"Sensitive Field Exposure in Error Messages",d:"Trigger validation errors to check if error responses reveal internal field names, data types, or actual values of restricted properties.",s:"med",t:["Burp Suite","Postman"],c:["CWE-209"]}
    ]
  },
  { id:"API4:2023", title:"Unrestricted Resource Consumption",
    desc:"APIs that do not limit the size or number of resources requested by the client are susceptible to Denial of Service and brute force attacks.",
    tests:[
      {n:"Missing Rate Limiting",d:"Send high-frequency requests to API endpoints and verify if rate limiting, throttling, or quota mechanisms are enforced to prevent abuse.",s:"high",t:["Burp Suite","FFUF","curl"],c:["CWE-770"]},
      {n:"Large Payload DoS",d:"Send oversized request bodies, deeply nested JSON, or extremely long string values to test if the API enforces payload size limits.",s:"med",t:["Burp Suite","curl"],c:["CWE-400"]},
      {n:"Pagination Abuse (limit/offset)",d:"Manipulate pagination parameters (limit=999999, page_size=100000) to force the API to return massive datasets consuming server resources.",s:"med",t:["Burp Suite","Postman"],c:["CWE-770"]},
      {n:"GraphQL Query Depth/Complexity Attack",d:"Craft deeply nested GraphQL queries or queries with high complexity scores to exhaust server resources. Test for query depth and complexity limits.",s:"high",t:["GraphQL Voyager","Burp Suite"],c:["CWE-400"]},
      {n:"Batch Request Abuse",d:"If the API supports batch/bulk operations, send extremely large batches to test for per-batch and per-item resource consumption limits.",s:"med",t:["Burp Suite","Postman"],c:["CWE-770"]},
      {n:"File Upload Size Limits",d:"Test file upload endpoints with oversized files, many concurrent uploads, and files that expand when processed (zip bombs) to verify resource limits.",s:"med",t:["Burp Suite","curl"],c:["CWE-400"]},
      {n:"Regex DoS via Input",d:"Submit specially crafted strings to fields likely validated by regex to test for catastrophic backtracking causing CPU exhaustion.",s:"med",t:["Burp Suite","custom scripts"],c:["CWE-1333"]}
    ]
  },
  { id:"API5:2023", title:"Broken Function Level Authorization",
    desc:"Complex access control policies with different hierarchies, groups, and roles create a high chance of authorization flaws. Attackers can access administrative functions they are not authorized to use.",
    tests:[
      {n:"Admin Endpoint Access as Regular User",d:"Discover and access administrative API endpoints (/api/admin/*, /api/internal/*) using a regular user's authentication token.",s:"high",t:["Burp Suite","FFUF","Kiterunner"],c:["CWE-285"]},
      {n:"HTTP Method Tampering",d:"Change HTTP methods on endpoints (GET to PUT/DELETE/PATCH) to test if method-level authorization is enforced independently for each HTTP verb.",s:"high",t:["Burp Suite","curl"],c:["CWE-284"]},
      {n:"API Version Rollback Attacks",d:"Access older API versions (v1, v2) that may have weaker authorization controls or lack security fixes applied to the current version.",s:"high",t:["FFUF","Burp Suite"],c:["CWE-285"]},
      {n:"Undocumented Endpoint Discovery",d:"Fuzz for hidden API endpoints using wordlists, API naming conventions, and patterns discovered in JavaScript source code or API documentation.",s:"high",t:["FFUF","Kiterunner","Burp Suite"],c:["CWE-285"]},
      {n:"Role-Based Function Access Bypass",d:"Test if lower-privileged roles can access functions restricted to higher roles by directly calling the endpoint with appropriate parameters.",s:"high",t:["Burp Suite","Postman"],c:["CWE-269"]},
      {n:"Debug/Test Endpoint Exposure",d:"Check for exposed debug endpoints (/debug, /test, /health, /metrics, /actuator) that may bypass authentication or expose sensitive system information.",s:"high",t:["FFUF","Nuclei","Burp Suite"],c:["CWE-489"]}
    ]
  },
  { id:"API6:2023", title:"Unrestricted Access to Sensitive Business Flows",
    desc:"APIs vulnerable to this risk expose business flows that can be abused through automation — purchasing, booking, commenting, or other workflows that were designed for human interaction.",
    tests:[
      {n:"Automated Purchase/Booking Abuse",d:"Automate purchase or booking flows to test for missing anti-automation controls (CAPTCHA, rate limiting, device fingerprinting) on business-critical transactions.",s:"high",t:["Burp Suite","custom scripts"],c:["CWE-799"]},
      {n:"Scraping Protection Bypass",d:"Test if API data endpoints have anti-scraping protections. Attempt to extract large datasets through pagination, search enumeration, or export functions.",s:"med",t:["Burp Suite","curl"],c:["CWE-799"]},
      {n:"Referral/Coupon System Abuse",d:"Test referral and coupon systems for abuse: self-referral, coupon reuse, race conditions in redemption, and generation of unlimited discount codes.",s:"high",t:["Burp Suite","Postman"],c:["CWE-840"]},
      {n:"Comment/Review Spam via API",d:"Test content submission endpoints for missing rate limiting, CAPTCHA, or anti-spam measures that would prevent automated content flooding.",s:"med",t:["Burp Suite","curl"],c:["CWE-799"]},
      {n:"Account Creation Automation",d:"Test registration endpoints for anti-automation controls. Attempt to create multiple accounts programmatically without human verification.",s:"med",t:["Burp Suite","custom scripts"],c:["CWE-799"]},
      {n:"Inventory Manipulation Attacks",d:"Test if items can be held in cart indefinitely, reserved without purchasing, or manipulated to affect inventory availability for other users.",s:"high",t:["Burp Suite","Postman"],c:["CWE-840"]}
    ]
  },
  { id:"API7:2023", title:"Server Side Request Forgery",
    desc:"SSRF flaws occur when an API fetches a remote resource without validating the user-supplied URL, allowing attackers to access internal services or cloud metadata.",
    tests:[
      {n:"SSRF via URL Parameters",d:"Inject internal URLs (http://127.0.0.1, http://localhost, http://[::1]) into API parameters that accept URLs to probe internal network services.",s:"high",t:["Burp Suite","Burp Collaborator"],c:["CWE-918"]},
      {n:"Webhook URL Manipulation",d:"Set webhook callback URLs to internal addresses or attacker-controlled servers to test for SSRF in webhook registration and delivery mechanisms.",s:"high",t:["Burp Suite","Burp Collaborator"],c:["CWE-918"]},
      {n:"File Import/Export SSRF",d:"Test file import features (CSV, XML, JSON from URL) for SSRF by providing internal URLs. Check if the server fetches and processes remote resources.",s:"high",t:["Burp Suite","Burp Collaborator"],c:["CWE-918"]},
      {n:"PDF Generator SSRF",d:"If the API generates PDFs from HTML/URLs, inject internal URLs or JavaScript-based redirects to access internal services through the PDF renderer.",s:"high",t:["Burp Suite","custom scripts"],c:["CWE-918"]},
      {n:"Image Proxy SSRF",d:"Test image proxy or avatar URL features by providing internal URLs, cloud metadata endpoints, or protocol handlers (file://, gopher://, dict://).",s:"high",t:["Burp Suite","Burp Collaborator"],c:["CWE-918"]},
      {n:"Cloud Metadata Endpoint Access",d:"Attempt to reach cloud metadata endpoints (169.254.169.254, metadata.google.internal) through SSRF to extract credentials, tokens, and configuration.",s:"high",t:["Burp Suite","curl"],c:["CWE-918"]},
      {n:"DNS Rebinding Attacks",d:"Use DNS rebinding techniques to bypass SSRF URL validation that checks the resolved IP at request time but connects to a different IP after DNS TTL expires.",s:"high",t:["Burp Suite","custom scripts"],c:["CWE-918"]}
    ]
  },
  { id:"API8:2023", title:"Security Misconfiguration",
    desc:"APIs and supporting systems typically contain complex configurations. Misconfigured security settings, unnecessary features, or verbose errors create exploitable vulnerabilities.",
    tests:[
      {n:"CORS Misconfiguration",d:"Test Access-Control-Allow-Origin for reflected origins, wildcard with credentials, or null origin acceptance that enables cross-origin data theft.",s:"high",t:["Burp Suite","curl"],c:["CWE-942"]},
      {n:"Verbose Error Messages",d:"Trigger errors with invalid inputs to check if API returns stack traces, framework versions, database details, or internal paths in error responses.",s:"med",t:["Burp Suite","Postman"],c:["CWE-209"]},
      {n:"Missing Security Headers",d:"Verify presence of security headers: Content-Security-Policy, X-Content-Type-Options, Strict-Transport-Security, X-Frame-Options, Cache-Control on API responses.",s:"med",t:["curl","Burp Suite"],c:["CWE-16"]},
      {n:"Exposed API Documentation",d:"Check for publicly accessible API documentation endpoints: /swagger-ui, /api-docs, /openapi.json, /graphql/playground that reveal all available endpoints.",s:"med",t:["FFUF","Nuclei"],c:["CWE-200"]},
      {n:"Unnecessary HTTP Methods Enabled",d:"Test each endpoint for supported HTTP methods (OPTIONS request) and verify that only required methods are allowed, especially TRACE and DEBUG.",s:"med",t:["Burp Suite","curl"],c:["CWE-16"]},
      {n:"Default Credentials on API Gateway",d:"Test API gateway management interfaces, admin panels, and monitoring dashboards for default credentials or weak authentication.",s:"high",t:["Hydra","Burp Suite"],c:["CWE-1392"]},
      {n:"TLS Configuration Weaknesses",d:"Test for weak TLS versions (1.0/1.1), weak cipher suites, missing HSTS, and certificate validation issues on API endpoints.",s:"med",t:["testssl.sh","Burp Suite"],c:["CWE-319"]}
    ]
  },
  { id:"API9:2023", title:"Improper Inventory Management",
    desc:"APIs tend to expose more endpoints than traditional web applications, making proper and updated documentation crucial. Deprecated or shadow APIs create security blind spots.",
    tests:[
      {n:"Old API Version Discovery",d:"Enumerate older API versions by fuzzing version prefixes (v1, v2, v3) and date-based versions to find deprecated endpoints with weaker security.",s:"high",t:["FFUF","Kiterunner","Burp Suite"],c:["CWE-1059"]},
      {n:"Shadow/Zombie API Endpoint Enumeration",d:"Discover undocumented or forgotten API endpoints through JavaScript analysis, mobile app decompilation, and API naming pattern fuzzing.",s:"high",t:["Kiterunner","FFUF","JS Miner"],c:["CWE-1059"]},
      {n:"Undocumented API Endpoint Fuzzing",d:"Fuzz for hidden endpoints using API-specific wordlists, HTTP method variations, and common naming patterns (/internal/, /debug/, /private/).",s:"high",t:["FFUF","Kiterunner"],c:["CWE-1059"]},
      {n:"API Gateway Bypass to Backend",d:"Attempt to access backend API services directly, bypassing the API gateway's authentication, rate limiting, and security controls.",s:"high",t:["Burp Suite","curl"],c:["CWE-284"]},
      {n:"Deprecated Endpoint Still Active",d:"Check if endpoints marked as deprecated in documentation are still functional and potentially lack security updates applied to current versions.",s:"high",t:["Burp Suite","Postman"],c:["CWE-1059"]},
      {n:"Internal API Exposure",d:"Test if internal-only APIs are accessible from external networks through misconfigured routing, missing network segmentation, or exposed debug endpoints.",s:"high",t:["FFUF","Nuclei","Burp Suite"],c:["CWE-668"]}
    ]
  },
  { id:"API10:2023", title:"Unsafe Consumption of APIs",
    desc:"Developers tend to trust data received from third-party APIs more than user input. Attackers target integrated third-party services to indirectly attack APIs.",
    tests:[
      {n:"Third-Party API Response Injection",d:"Test if the API properly validates and sanitizes data received from third-party APIs before processing, storing, or forwarding to clients.",s:"high",t:["Burp Suite","Postman"],c:["CWE-20"]},
      {n:"Webhook Payload Validation",d:"Send crafted webhook payloads to test if the API validates webhook signatures, source IPs, and sanitizes payload content before processing.",s:"high",t:["Burp Suite","curl"],c:["CWE-345"]},
      {n:"SSRF via Third-Party Redirects",d:"Test if the API follows redirects from third-party services without validation, potentially being redirected to internal services or malicious endpoints.",s:"high",t:["Burp Suite","Burp Collaborator"],c:["CWE-918"]},
      {n:"Deserialization of External API Data",d:"Test if the API deserializes data from external sources without validation, potentially enabling object injection or remote code execution.",s:"high",t:["Burp Suite","ysoserial"],c:["CWE-502"]},
      {n:"Insufficient External Certificate Validation",d:"Verify that the API validates TLS certificates when connecting to third-party services and doesn't trust self-signed or expired certificates.",s:"med",t:["Burp Suite","mitmproxy"],c:["CWE-295"]},
      {n:"Blind Trust of Partner API Data",d:"Test if the API applies the same input validation rules to data from trusted partners as it does to user input, preventing injection via trusted sources.",s:"high",t:["Burp Suite","Postman"],c:["CWE-20"]}
    ]
  },
];

const SK='kenziy_owasp_api_2023';
let S=JSON.parse(localStorage.getItem(SK)||'{}');
function save(){ localStorage.setItem(SK,JSON.stringify(S)); }
function ok(id,i){ return !!(S[id]&&S[id][i]); }
function toggle(id,i){ if(!S[id]) S[id]={}; S[id][i]=!S[id][i]; save(); render(id); prog(); }
function sc(s){ return s==='high'?'s-high':s==='med'?'s-med':s==='low'?'s-low':'s-info'; }
function tc(s){ return s==='high'?'t-high':s==='med'?'t-med':'t-low'; }
function sl(s){ return s==='high'?'HIGH':s==='med'?'MED':s==='low'?'LOW':'INFO'; }
function cid(id){ return id.replace(':','_'); }

function build(){
  const m=document.getElementById('main'); m.innerHTML='';
  CATS.forEach(cat=>{
    const el=document.createElement('div');
    el.className='category'; el.id='c_'+cid(cat.id);
    el.innerHTML=`<div class="cat-header" onclick="toggleC('${cat.id}')">
      <span class="cat-prompt">$</span><span class="cat-id">${cat.id}</span>
      <span class="cat-title">${cat.title}</span>
      <span class="cat-stats"><span class="done" id="sd_${cid(cat.id)}">0</span>/${cat.tests.length}</span>
      <span class="cat-chevron">▼</span></div>
    <div class="cat-body"><div class="cat-desc">${cat.desc}</div>
      <div class="test-list" id="tl_${cid(cat.id)}"></div></div>`;
    m.appendChild(el); render(cat.id);
  });
}

function render(id){
  const cat=CATS.find(c=>c.id===id);
  const list=document.getElementById('tl_'+cid(id)); if(!list) return;
  let dc=0;
  list.innerHTML=cat.tests.map((t,i)=>{
    const done=ok(id,i); if(done) dc++;
    return `<div class="test-item${done?' done':''}" onclick="toggle('${id}',${i})">
      <div class="sev-bar ${sc(t.s)}"></div>
      <div class="check-box"><svg width="10" height="8" viewBox="0 0 10 8" fill="none">
        <path d="M1 4L3.5 6.5L9 1" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="test-content"><div class="test-name">${t.n}</div><div class="test-detail">${t.d}</div>
        <div class="test-tags"><span class="tag ${tc(t.s)}">${sl(t.s)}</span>
          ${t.t.map(x=>`<span class="tag t-tool">${x}</span>`).join('')}
          ${t.c.map(x=>`<span class="tag t-cwe">${x}</span>`).join('')}</div></div></div>`;
  }).join('');
  const s=document.getElementById('sd_'+cid(id)); if(s) s.textContent=dc;
}

function prog(){
  let tot=0,dn=0;
  CATS.forEach(c=>c.tests.forEach((_,i)=>{ tot++; if(ok(c.id,i)) dn++; }));
  document.getElementById('doneCount').textContent=dn;
  document.getElementById('totalCount').textContent=tot;
  const p=tot?Math.round(dn/tot*100):0;
  document.getElementById('progressFill').style.width=p+'%';
  document.getElementById('percentText').textContent=p+'%';
}

function toggleC(id){ document.getElementById('c_'+cid(id)).classList.toggle('collapsed'); }
function expandAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.remove('collapsed')); }
function collapseAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.add('collapsed')); }
function setF(id){ ['fAll','fPending','fDone'].forEach(f=>document.getElementById(f).classList.remove('active')); document.getElementById(id).classList.add('active'); }
function filterAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.remove('hidden')); setF('fAll'); }
function filterPending(){ CATS.forEach(c=>{ const all=c.tests.every((_,i)=>ok(c.id,i)); document.getElementById('c_'+cid(c.id)).classList.toggle('hidden',all); }); setF('fPending'); }
function filterDone(){ CATS.forEach(c=>{ const all=c.tests.every((_,i)=>ok(c.id,i)); document.getElementById('c_'+cid(c.id)).classList.toggle('hidden',!all); }); setF('fDone'); }
function resetAll(){ if(!confirm('reset all progress?')) return; S={}; save(); build(); prog(); }

build(); prog();
</script>
