<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~/kenziy — OWASP Top 10:2025 Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #21262d;
    --border2:  #30363d;
    --green:    #3fb950;
    --green2:   rgba(63,185,80,0.12);
    --green-glow: 0 0 8px rgba(63,185,80,0);
    --red:      #ff3333;
    --yellow:   #ffcc00;
    --cyan:     #00e5ff;
    --gray:     #444444;
    --text:     #e6edf3;
    --text-dim: #8b949e;
    --mono:     'IBM Plex Mono', 'Consolas', 'Menlo', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* CRT scanlines */

  /* ── NAVBAR ── */
  .navbar {
    border-bottom: 1px solid var(--border2);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 200;
  }

  .nav-brand {
    color: var(--green);
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    text-shadow: var(--green-glow);
  }
  .nav-brand .dim { color: var(--text-dim); }

  .nav-links {
    display: flex;
    gap: 18px;
    list-style: none;
    flex-wrap: wrap;
  }
  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.12s;
  }
  .nav-links a:hover { color: var(--green); }

  /* ── HEADER ── */
  .header {
    padding: 24px 24px 18px;
    border-bottom: 1px solid var(--border2);
  }

  .header-path {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .header-path .hl { color: var(--green); }

  .header-title {
    font-size: clamp(16px, 3.5vw, 24px);
    font-weight: 500;
    color: var(--green);
    text-shadow: var(--green-glow);
    margin-bottom: 4px;
  }
  .header-title .prompt { color: var(--text-dim); }

  .header-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  .header-sub a { color: var(--cyan); text-decoration: none; }
  .header-sub a:hover { text-decoration: underline; }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .progress-label {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .progress-label strong {
    color: var(--green);
    font-size: 17px;
    font-weight: 600;
    text-shadow: var(--green-glow);
  }
  .progress-track {
    flex: 1;
    min-width: 100px;
    max-width: 280px;
    height: 4px;
    background: var(--border2);
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    box-shadow: var(--green-glow);
    transition: width 0.3s ease;
  }
  .progress-pct {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* blinking cursor */
  .cursor {
    display: inline-block;
    width: 9px;
    height: 15px;
    background: var(--green);
    vertical-align: middle;
    margin-left: 3px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── CONTROLS ── */
  .controls {
    padding: 10px 24px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border2);
  }

  .target-input {
    font-family: var(--mono);
    font-size: 13px;
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--green);
    outline: none;
    width: clamp(140px, 30vw, 240px);
    caret-color: var(--green);
    transition: border-color 0.12s;
  }
  .target-input::placeholder { color: var(--text-dim); }
  .target-input:focus { border-color: var(--green); }

  .sep { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-dim);
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .btn:hover        { border-color: var(--green); color: var(--green); }
  .btn.active       { border-color: var(--green); color: var(--green); background: var(--green2); }
  .btn.danger       { color: var(--red); border-color: rgba(255,51,51,0.2); }
  .btn.danger:hover { background: rgba(255,51,51,0.07); border-color: var(--red); }

  /* ── MAIN ── */
  .main {
    padding: 18px 24px 64px;
    max-width: 960px;
    margin: 0 auto;
  }

  /* ── CATEGORY ── */
  .category {
    margin-bottom: 14px;
    border: 1px solid var(--border2);
  }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .cat-header:hover { background: #1c2128; }

  .cat-prompt { color: var(--text-dim); font-size: 14px; flex-shrink: 0; }
  .cat-id     { color: var(--green); font-size: 13px; font-weight: 500; flex-shrink: 0; text-shadow: var(--green-glow); }
  .cat-title  { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-stats  { font-size: 12px; color: var(--text-dim); flex-shrink: 0; margin-left: 8px; }
  .cat-stats .done { color: var(--green); }
  .cat-chevron { color: var(--text-dim); font-size: 11px; transition: transform 0.16s; flex-shrink: 0; }

  .category.collapsed .cat-chevron { transform: rotate(-90deg); }
  .category.collapsed .cat-body    { display: none; }

  .cat-desc {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.5);
    line-height: 1.7;
  }
  .cat-desc::before { content: '# '; color: var(--border2); }

  /* ── TEST ITEMS ── */
  .test-item {
    display: grid;
    grid-template-columns: 3px 18px 1fr;
    gap: 0 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.08s;
    align-items: start;
  }
  .test-item:last-child { border-bottom: none; }
  .test-item:hover { background: rgba(63,185,80,0.025); }
  .test-item.done  { background: rgba(63,185,80,0.015); }
  .test-item.done .test-name {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: rgba(63,185,80,0.2);
  }
  .test-item.done .test-detail { opacity: 0.38; }

  .sev-bar { align-self: stretch; min-height: 16px; }
  .s-high { background: var(--red);    box-shadow: 0 0 5px rgba(255,51,51,0.4); }
  .s-med  { background: var(--yellow); box-shadow: 0 0 5px rgba(255,204,0,0.35); }
  .s-low  { background: var(--cyan);   box-shadow: 0 0 5px rgba(0,229,255,0.3); }
  .s-info { background: var(--gray); }

  .check-box {
    width: 14px; height: 14px;
    border: 1px solid var(--gray);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    flex-shrink: 0;
    transition: all 0.12s;
  }
  .test-item:hover .check-box    { border-color: var(--green); }
  .test-item.done .check-box     { background: var(--green); border-color: var(--green); box-shadow: var(--green-glow); }
  .check-box svg                 { display: none; }
  .test-item.done .check-box svg { display: block; }

  .test-content { min-width: 0; }

  .test-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .test-name::before { content: '> '; color: var(--text-dim); }

  .test-detail {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 6px;
  }

  .test-tags { display: flex; flex-wrap: wrap; gap: 4px; }

  .tag {
    font-size: 10px;
    padding: 2px 7px;
    border: 1px solid;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .t-high { color: var(--red);    border-color: rgba(255,51,51,0.3);  background: rgba(255,51,51,0.05); }
  .t-med  { color: var(--yellow); border-color: rgba(255,204,0,0.3);  background: rgba(255,204,0,0.04); }
  .t-low  { color: var(--cyan);   border-color: rgba(0,229,255,0.25); background: rgba(0,229,255,0.04); }
  .t-tool { color: var(--green);  border-color: rgba(63,185,80,0.2);   background: rgba(63,185,80,0.04); }
  .t-cwe  { color: #8b949e;          border-color: rgba(100,100,100,0.2);background: transparent; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 18px 24px;
    font-size: 12px;
    color: var(--text-dim);
    border-top: 1px solid var(--border2);
  }
  footer a { color: var(--green); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .hidden { display: none !important; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .navbar    { padding: 10px 14px; }
    .header    { padding: 16px 14px 14px; }
    .controls  { padding: 8px 14px; }
    .main      { padding: 12px 14px 52px; }
    .cat-header { padding: 9px 12px; gap: 6px; }
    .cat-desc  { padding: 7px 12px; }
    .test-item { padding: 9px 12px; gap: 0 10px; }
    .test-name { font-size: 13px; }
    .btn       { font-size: 11px; padding: 5px 8px; }
    .target-input { width: 100%; }
    .sep       { display: none; }
    .progress-track { min-width: 70px; }
    .nav-links { gap: 10px; }
  }

  @media (max-width: 380px) {
    .nav-links { display: none; }
    .header-title { font-size: 13px; }
    .cat-title { font-size: 12px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="https://kenziy.com"><span class="dim">~/</span>kenziy</a>
  <ul class="nav-links">
    <li><a href="https://kenziy.com/#about">about</a></li>
    <li><a href="https://kenziy.com/#targets">targets</a></li>
    <li><a href="https://kenziy.com/#cves">cves</a></li>
    <li><a href="https://kenziy.com/#certs">certs</a></li>
    <li><a href="https://hackerone.com/kenziy" target="_blank">hackerone</a></li>
  </ul>
</nav>

<div class="header">
  <div class="header-path">~/kenziy/<span class="hl">pentest-checklist</span></div>
  <div class="header-title">
    <span class="prompt">$ </span>OWASP Top 10:2025 Checklist<span class="cursor"></span>
  </div>
  <div class="header-sub">
    source: <a href="https://owasp.org/Top10/2025/" target="_blank">owasp.org/Top10/2025/</a>
    &nbsp;·&nbsp; authorized penetration testing only
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><strong id="doneCount">0</strong> / <span id="totalCount">0</span> completed</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-pct" id="percentText">0%</div>
  </div>
</div>

<div class="controls">
  <input class="target-input" type="text" id="targetInput" placeholder="target: https://..." />
  <div class="sep"></div>
  <button class="btn" onclick="expandAll()">expand_all</button>
  <button class="btn" onclick="collapseAll()">collapse_all</button>
  <div class="sep"></div>
  <button class="btn active" id="fAll"     onclick="filterAll()">--all</button>
  <button class="btn"        id="fPending" onclick="filterPending()">--pending</button>
  <button class="btn"        id="fDone"    onclick="filterDone()">--done</button>
  <div class="sep"></div>
  <button class="btn danger" onclick="resetAll()">reset</button>
</div>

<main class="main" id="main"></main>

<footer>
  <a href="https://kenziy.com">~/kenziy</a>
  &nbsp;·&nbsp;
  <a href="https://owasp.org/Top10/2025/" target="_blank">OWASP Top 10:2025</a>
  &nbsp;·&nbsp;
  <a href="https://hackerone.com/kenziy" target="_blank">HackerOne</a>
  &nbsp;·&nbsp; for authorized use only
</footer>

<script>
const CATS = [
  { id:"A01:2025", title:"Broken Access Control",
    desc:"Access control enforces policies so users cannot act outside their intended permissions. Failures lead to unauthorized information disclosure, modification, or destruction of data.",
    tests:[
      {n:"Horizontal Privilege Escalation",d:"Modify user IDs in requests (e.g. /api/users/123 → /api/users/124) to access other users' data without authorization.",s:"high",t:["Burp Suite","FFUF"],c:["CWE-639"]},
      {n:"Vertical Privilege Escalation",d:"Access admin/privileged endpoints as a low-privilege user. Change roles in JWTs, cookies, or hidden form fields to elevate permissions.",s:"high",t:["Burp Suite"],c:["CWE-269"]},
      {n:"IDOR — Insecure Direct Object Reference",d:"Enumerate object references (numeric IDs, GUIDs, filenames) in URLs, body params, and headers to access unauthorized records.",s:"high",t:["Burp Suite","Autorize"],c:["CWE-284"]},
      {n:"Forced Browsing to Restricted Pages",d:"Directly navigate to admin panels, dashboards, or config pages (/admin, /dashboard, /config) without going through normal auth flow.",s:"high",t:["FFUF","DirBuster"],c:["CWE-425"]},
      {n:"Missing Function-Level Access Control",d:"Call API endpoints or functions not in the UI but accessible to lower-privileged roles. Check JS source files for hidden routes.",s:"high",t:["Burp Suite","JS Miner"],c:["CWE-285"]},
      {n:"CORS Misconfiguration",d:"Test if Access-Control-Allow-Origin reflects attacker-controlled origins. Check if credentials are allowed with wildcard or reflected origins.",s:"med",t:["Burp Suite","curl"],c:["CWE-942"]},
      {n:"Path Traversal / Directory Traversal",d:"Inject ../../ sequences in file parameters to read system files (e.g. /etc/passwd). Test URL-encoded variants: %2e%2e%2f, %252e.",s:"high",t:["Burp Suite","dotdotpwn"],c:["CWE-22"]},
      {n:"HTTP Method Override Abuse",d:"Use X-HTTP-Method-Override headers to bypass method restrictions. Try POST with X-HTTP-Method-Override: DELETE on protected resources.",s:"med",t:["Burp Suite","curl"],c:["CWE-284"]},
      {n:"JWT / Token Manipulation",d:"Test alg:none attack, weak secret brute-force (jwt_tool), kid injection, and jku/jwks_uri hijacking to forge elevated privilege tokens.",s:"high",t:["jwt_tool","Burp Suite"],c:["CWE-345"]},
      {n:"Mass Assignment",d:"Submit extra fields in JSON bodies (e.g. isAdmin:true, role:admin) to see if server binds them to model properties inadvertently.",s:"high",t:["Burp Suite"],c:["CWE-915"]},
    ]
  },
  { id:"A02:2025", title:"Security Misconfiguration",
    desc:"Most commonly seen issue, resulting from insecure default configurations, incomplete setups, open cloud storage, verbose error messages, and unnecessary features enabled in production.",
    tests:[
      {n:"Default Credentials Check",d:"Test default username/password combos (admin/admin, admin/password) on login pages, admin panels, databases, and management interfaces.",s:"high",t:["Hydra","Burp Suite"],c:["CWE-1392"]},
      {n:"Verbose Error Messages",d:"Trigger errors (invalid input, SQLi syntax) to check if server returns framework versions, DB schema, internal paths, or full stack traces.",s:"med",t:["Burp Suite"],c:["CWE-209"]},
      {n:"Unnecessary Services / Exposed Endpoints",d:"Scan for open ports and check for dev endpoints (/actuator, /debug, /_profiler, /graphql playground, /swagger-ui) accessible in production.",s:"med",t:["Nmap","Masscan"],c:["CWE-200"]},
      {n:"HTTP Security Headers Missing",d:"Check for missing: Content-Security-Policy, X-Frame-Options, X-Content-Type-Options, Strict-Transport-Security, Referrer-Policy, Permissions-Policy.",s:"med",t:["securityheaders.com","curl"],c:["CWE-16"]},
      {n:"Directory Listing Enabled",d:"Request directory paths (e.g. /uploads/, /static/, /assets/) and verify if server returns file listings exposing sensitive files.",s:"med",t:["FFUF","Burp Suite"],c:["CWE-548"]},
      {n:"Cloud Storage Misconfiguration",d:"Test for publicly accessible S3 buckets, Azure Blob containers, GCS buckets. Enumerate bucket names from JS/HTML source and test read/list permissions.",s:"high",t:["AWSBucketDump","S3Scanner"],c:["CWE-732"]},
      {n:"Exposed .git / .env / Config Files",d:"Request /.git/HEAD, /.env, /config.php, /web.config, /docker-compose.yml, /.htaccess to check for exposed secrets or source code.",s:"high",t:["GitTools","FFUF"],c:["CWE-538"]},
      {n:"Debug Mode / Dev Features Active",d:"Check if debug=True, profiling tools, or test accounts are enabled in production. Look for debug toolbar, verbose logging, or phpinfo().",s:"high",t:["Burp Suite","curl"],c:["CWE-94"]},
      {n:"XML External Entity (XXE)",d:"Send crafted XML with DOCTYPE referencing external entities to read local files or perform SSRF. Test all XML-accepting endpoints and SOAP services.",s:"high",t:["Burp Suite"],c:["CWE-611"]},
      {n:"HTTPS / TLS Configuration",d:"Test for HTTP to HTTPS downgrade, mixed content, weak cipher suites (RC4, DES), outdated TLS versions (1.0/1.1), and invalid/expired certificates.",s:"med",t:["testssl.sh","ssllabs.com"],c:["CWE-319"]},
    ]
  },
  { id:"A03:2025", title:"Software Supply Chain Failures",
    desc:"New in 2025 — risks from third-party components, open-source libraries, build pipelines, and the integrity of software artifacts sourced from external parties.",
    tests:[
      {n:"Outdated / Vulnerable Dependencies",d:"Identify all client-side and server-side libraries with versions from JS bundles, HTTP headers, HTML comments, or package manifests. Match against CVE databases.",s:"high",t:["Retire.js","OWASP DC","Snyk"],c:["CWE-1104"]},
      {n:"Subresource Integrity (SRI) Missing",d:"Check if external CDN scripts/styles include integrity= and crossorigin= attributes. Missing SRI allows CDN compromise to inject malicious code.",s:"med",t:["Burp Suite","curl"],c:["CWE-353"]},
      {n:"Typosquatting / Dependency Confusion",d:"Check package.json, requirements.txt, go.mod for dependencies that could be confused with malicious public packages of similar names.",s:"high",t:["pip-audit","npm audit"],c:["CWE-829"]},
      {n:"Build Pipeline Exposure",d:"Check for exposed CI/CD endpoints, Jenkinsfiles, .github/workflows, or .gitlab-ci.yml in publicly accessible repos or admin panels.",s:"high",t:["FFUF","GitHub search"],c:["CWE-912"]},
      {n:"Third-Party Script Behavior",d:"Audit all third-party JS loaded on the page (analytics, chat widgets, ad networks) for suspicious network requests, data exfiltration, or eval() usage.",s:"med",t:["Burp Suite","Browser DevTools"],c:["CWE-829"]},
      {n:"SBOM / Dependency Manifest Review",d:"Attempt to retrieve SBOM or dependency manifest files from the application to map the full component tree and identify high-risk libraries.",s:"low",t:["Syft","Grype"],c:["CWE-1104"]},
    ]
  },
  { id:"A04:2025", title:"Cryptographic Failures",
    desc:"Failures related to cryptography (or lack thereof) leading to exposure of sensitive data. Includes weak algorithms, improper key management, and cleartext data transmission.",
    tests:[
      {n:"Sensitive Data in Transit (No TLS)",d:"Capture traffic and verify all sensitive data (credentials, PII, tokens) is transmitted over HTTPS. Test for HTTP fallback and mixed-content issues.",s:"high",t:["Wireshark","mitmproxy"],c:["CWE-319"]},
      {n:"Weak / Broken Cryptographic Algorithms",d:"Identify use of MD5, SHA-1, DES, RC4, ECB mode, or small RSA key sizes (<2048 bits) in cookies, password storage, tokens, or API responses.",s:"high",t:["Hashcat","testssl.sh"],c:["CWE-327"]},
      {n:"Hardcoded Secrets in Source / JS Bundles",d:"Search minified JS, HTML, API responses, and git history for API keys, tokens, passwords, and private keys using regex patterns and secret scanners.",s:"high",t:["TruffleHog","Gitleaks","JS Miner"],c:["CWE-798"]},
      {n:"Insecure Cookie Attributes",d:"Verify session cookies have Secure, HttpOnly, and SameSite=Strict/Lax attributes. Missing flags enable theft via XSS, MITM, or CSRF attacks.",s:"med",t:["Burp Suite","Browser DevTools"],c:["CWE-614"]},
      {n:"Weak Password Hashing",d:"Where possible (error messages, timing attacks, hash disclosure), determine if passwords are stored as MD5/SHA-1/unsalted hashes rather than bcrypt/Argon2/scrypt.",s:"high",t:["Hashcat","John the Ripper"],c:["CWE-916"]},
      {n:"Sensitive Data in URL / Logs",d:"Check if tokens, passwords, or PII appear in GET parameters (logged in server logs, browser history, Referer headers, or error pages).",s:"med",t:["Burp Suite"],c:["CWE-312"]},
      {n:"Insecure Random Number Generation",d:"Analyze password reset tokens, session IDs, and CSRF tokens for predictability or insufficient entropy using Burp Sequencer or statistical tests.",s:"high",t:["Burp Sequencer","custom scripts"],c:["CWE-338"]},
    ]
  },
  { id:"A05:2025", title:"Injection",
    desc:"Injection flaws occur when hostile data is sent to an interpreter as part of a command or query. Includes SQL, NoSQL, OS command, LDAP, SSTI, and expression language injection.",
    tests:[
      {n:"SQL Injection (Classic & Blind)",d:"Test all input parameters with SQLi payloads: ' OR 1=1--, time-based (SLEEP/WAITFOR), boolean-based, and error-based. Use sqlmap for automated discovery.",s:"high",t:["sqlmap","Burp Suite"],c:["CWE-89"]},
      {n:"NoSQL Injection",d:"For MongoDB/CouchDB apps, inject JSON operators: {$gt:''}, {$where:'sleep(5000)'}, or array injection in parameters. Check login bypass scenarios.",s:"high",t:["Burp Suite","NoSQLMap"],c:["CWE-943"]},
      {n:"OS Command Injection",d:"Inject OS commands via ; && | backticks in parameters processed by server-side shell functions. Check file uploads, ping utilities, and system-call wrappers.",s:"high",t:["Burp Suite","commix"],c:["CWE-78"]},
      {n:"Server-Side Template Injection (SSTI)",d:"Inject template expressions: {{7*7}}, ${7*7}, #{7*7} in input fields that reflect output. Escalate to RCE by accessing template object internals.",s:"high",t:["tplmap","Burp Suite"],c:["CWE-94"]},
      {n:"LDAP Injection",d:"If the app uses LDAP directory queries, inject LDAP metacharacters: *, (, ), \\ in authentication or search fields to bypass auth or dump directory data.",s:"high",t:["Burp Suite"],c:["CWE-90"]},
      {n:"XPath Injection",d:"For XML/XPath queries, test with ' or '1'='1 to manipulate XPath logic and extract unauthorized XML data from the backend store.",s:"med",t:["Burp Suite"],c:["CWE-643"]},
      {n:"HTTP Header Injection (CRLF)",d:"Inject \\r\\n sequences in URL parameters reflected in response headers (Location, Set-Cookie) to split responses or inject malicious headers.",s:"med",t:["Burp Suite"],c:["CWE-113"]},
      {n:"GraphQL Injection & Introspection",d:"Enable introspection to map full schema. Test mutations/queries for missing authorization, batching attacks (DoS), and injection in arguments.",s:"high",t:["GraphQL Voyager","Burp Suite"],c:["CWE-89"]},
    ]
  },
  { id:"A06:2025", title:"Insecure Design",
    desc:"Risks related to design and architectural flaws. Insecure design cannot be fixed by perfect implementation — it requires security design patterns and threat modeling from the outset.",
    tests:[
      {n:"Business Logic Bypass",d:"Analyze multi-step workflows (checkout, approval flows) for logic flaws: skip steps, replay steps, submit negative quantities, apply discount codes multiple times.",s:"high",t:["Burp Suite","Manual"],c:["CWE-840"]},
      {n:"Race Condition / TOCTOU",d:"Send concurrent requests to exploit time-of-check time-of-use: simultaneous coupon redemption, balance withdrawals, vote stuffing, or one-time token reuse.",s:"high",t:["Turbo Intruder","Burp Suite"],c:["CWE-362"]},
      {n:"Account Enumeration",d:"Test login, registration, password reset, and 2FA flows for differential responses (timing, message) that reveal whether usernames/emails exist in the system.",s:"med",t:["Burp Suite","FFUF"],c:["CWE-204"]},
      {n:"Insecure Password Reset Flow",d:"Test reset token entropy, expiry, single-use enforcement. Check for host header injection in reset emails to redirect tokens to attacker-controlled domains.",s:"high",t:["Burp Suite"],c:["CWE-640"]},
      {n:"Missing Rate Limiting",d:"Test for missing rate limits on registration, file upload size caps, API call quotas, or operations that could be abused to exhaust server resources.",s:"med",t:["Burp Intruder","curl"],c:["CWE-400"]},
      {n:"Workflow State Manipulation",d:"Modify hidden state fields, parameters, or cookies that control application flow steps. Test skipping payment steps, approval gates, or verification phases.",s:"high",t:["Burp Suite"],c:["CWE-841"]},
    ]
  },
  { id:"A07:2025", title:"Authentication Failures",
    desc:"Authentication-related weaknesses allowing attackers to assume other users' identities. Includes credential stuffing, brute force, weak session management, and broken remember-me functionality.",
    tests:[
      {n:"Brute Force / Credential Stuffing",d:"Test for account lockout, rate limiting, or CAPTCHA absence on login. Use known credential lists with Hydra or Burp Intruder to verify protection.",s:"high",t:["Hydra","Burp Intruder"],c:["CWE-307"]},
      {n:"Weak Session ID Entropy",d:"Collect 100+ session tokens via Burp Sequencer and analyze for predictability, sequential patterns, or insufficient entropy (<64 bits).",s:"high",t:["Burp Sequencer"],c:["CWE-330"]},
      {n:"Session Fixation",d:"Verify session ID rotates upon successful authentication. If pre-auth session ID is reused post-login, attacker can fixate a known session ID.",s:"high",t:["Burp Suite"],c:["CWE-384"]},
      {n:"Session Persistence After Logout",d:"Capture session token, log out, then replay the old token in requests. A valid response indicates session invalidation is not enforced server-side.",s:"high",t:["Burp Suite"],c:["CWE-613"]},
      {n:"Multi-Factor Authentication Bypass",d:"Test if MFA can be bypassed by: skipping the MFA step, replaying old OTPs, using null/empty OTP values, or response manipulation (false → true).",s:"high",t:["Burp Suite"],c:["CWE-308"]},
      {n:"Remember Me / Persistent Token Analysis",d:"Decode and analyze persistent 'remember me' tokens for predictability. Check if they encode user data that can be forged without server-side validation.",s:"med",t:["Burp Suite","jwt_tool"],c:["CWE-613"]},
      {n:"OAuth / SSO Misconfiguration",d:"Test redirect_uri validation (open redirect), state parameter CSRF protection, token leakage in Referrer header, and implicit flow token theft.",s:"high",t:["Burp Suite"],c:["CWE-601"]},
    ]
  },
  { id:"A08:2025", title:"Software or Data Integrity Failures",
    desc:"Code and infrastructure that does not protect against integrity violations — insecure deserialization, auto-updates without integrity checks, and CI/CD pipeline integrity failures.",
    tests:[
      {n:"Insecure Deserialization",d:"Send serialized payloads (Java, PHP, Python pickle, .NET) in cookies, hidden fields, API params. Use ysoserial/PHPGGC to generate gadget chains for RCE.",s:"high",t:["ysoserial","PHPGGC","Burp Suite"],c:["CWE-502"]},
      {n:"Cross-Site Request Forgery (CSRF)",d:"Test state-changing requests for CSRF token presence, validation of token, and SameSite cookie enforcement. Craft a PoC page for critical functions.",s:"high",t:["Burp Suite"],c:["CWE-352"]},
      {n:"Server-Side Request Forgery (SSRF)",d:"Inject internal URLs (http://169.254.169.254/, http://localhost) into URL parameters, webhooks, and import functions to probe internal services and cloud metadata.",s:"high",t:["Burp Collaborator","FFUF"],c:["CWE-918"]},
      {n:"Auto-Update Integrity Check",d:"If the application has auto-update functionality, verify update packages are signature-verified and fetched over HTTPS. Test for update package hijacking.",s:"high",t:["Wireshark","Burp Suite"],c:["CWE-494"]},
      {n:"Client-Side Data Integrity",d:"Check if security decisions are based on client-supplied data (prices, discounts, roles) stored in cookies, hidden fields, or localStorage without server validation.",s:"high",t:["Burp Suite","Browser DevTools"],c:["CWE-602"]},
    ]
  },
  { id:"A09:2025", title:"Security Logging and Alerting Failures",
    desc:"Without logging and monitoring, breaches cannot be detected. Covers insufficient logging, lack of monitoring, and failure to respond to suspicious activities in a timely manner.",
    tests:[
      {n:"Authentication Events Not Logged",d:"Perform failed logins, account lockouts, and successful logins then verify if these events appear in server logs with sufficient detail (user, IP, timestamp).",s:"med",t:["Burp Suite","Manual"],c:["CWE-778"]},
      {n:"Log Injection",d:"Inject CRLF sequences or log format strings into input fields written to logs to corrupt log files or inject false log entries to cover tracks.",s:"low",t:["Burp Suite"],c:["CWE-117"]},
      {n:"Sensitive Data in Logs",d:"Review any accessible log endpoints (/logs, /debug, server error dumps) for passwords, tokens, PII, or API keys being inadvertently written to logs.",s:"high",t:["Burp Suite","Manual"],c:["CWE-532"]},
      {n:"No Alerting on Brute Force",d:"Perform 50+ failed login attempts and verify if any alerting, lockout, or CAPTCHA triggers. Absence indicates no active monitoring for attack patterns.",s:"med",t:["Hydra","Burp Intruder"],c:["CWE-223"]},
      {n:"API Activity Not Monitored",d:"Make anomalous API requests (high frequency, unusual patterns, accessing unrelated endpoints) and check if rate limiting or anomaly detection triggers.",s:"med",t:["Burp Suite"],c:["CWE-778"]},
    ]
  },
  { id:"A10:2025", title:"Mishandling of Exceptional Conditions",
    desc:"New in 2025 — applications failing to properly handle errors, edge cases, unexpected inputs, or exceptional conditions leading to security failures, data leakage, or system instability.",
    tests:[
      {n:"Unhandled Exception / Stack Trace Disclosure",d:"Send malformed inputs, unexpected data types, oversized payloads, and special characters to trigger exceptions that reveal internal paths, library versions, or stack traces.",s:"med",t:["Burp Suite"],c:["CWE-209"]},
      {n:"Null / Empty Input Handling",d:"Submit empty strings, null values, zero, negative numbers, and boundary values to all input fields and verify the application handles them gracefully without crashing.",s:"low",t:["Burp Suite"],c:["CWE-476"]},
      {n:"Integer Overflow / Underflow",d:"Submit max integer values (2147483647, 9007199254740992) and negative values in numeric fields (quantities, IDs, amounts) to test for overflow conditions.",s:"med",t:["Burp Suite"],c:["CWE-190"]},
      {n:"File Upload Edge Cases",d:"Upload files with: double extensions (file.php.jpg), null bytes (file.php%00.jpg), path traversal in filename, oversized files, and empty files to test handling.",s:"high",t:["Burp Suite","ExifTool"],c:["CWE-434"]},
      {n:"Regex ReDoS (Denial of Service)",d:"Identify input fields using regex validation and submit specially crafted strings causing catastrophic backtracking (e.g., aaaaaaaaaaaaaaaaaaaX for (a+)+ patterns).",s:"med",t:["Burp Suite","OWASP ReDoS"],c:["CWE-1333"]},
      {n:"Resource Exhaustion / Zip Bomb",d:"Upload maliciously crafted files (zip bombs, XML bombs with entity expansion, deeply nested JSON) to test if parsing limits are enforced to prevent DoS.",s:"med",t:["Custom scripts","Burp Suite"],c:["CWE-400"]},
      {n:"Concurrent Request Handling",d:"Send simultaneous identical requests to critical endpoints (checkout, file processing) and observe if race conditions, duplicate processing, or data corruption occurs.",s:"med",t:["Turbo Intruder","Go scripts"],c:["CWE-362"]},
    ]
  },
];

const SK='kenziy_owasp_2025';
let S=JSON.parse(localStorage.getItem(SK)||'{}');
function save(){ localStorage.setItem(SK,JSON.stringify(S)); }
function ok(id,i){ return !!(S[id]&&S[id][i]); }
function toggle(id,i){
  if(!S[id]) S[id]={};
  S[id][i]=!S[id][i];
  save(); render(id); prog();
}
function sc(s){ return s==='high'?'s-high':s==='med'?'s-med':s==='low'?'s-low':'s-info'; }
function tc(s){ return s==='high'?'t-high':s==='med'?'t-med':'t-low'; }
function sl(s){ return s==='high'?'HIGH':s==='med'?'MED':s==='low'?'LOW':'INFO'; }
function cid(id){ return id.replace(':','_'); }

function build(){
  const m=document.getElementById('main');
  m.innerHTML='';
  CATS.forEach(cat=>{
    const el=document.createElement('div');
    el.className='category'; el.id='c_'+cid(cat.id);
    el.innerHTML=`<div class="cat-header" onclick="toggleC('${cat.id}')">
      <span class="cat-prompt">$</span>
      <span class="cat-id">${cat.id}</span>
      <span class="cat-title">${cat.title}</span>
      <span class="cat-stats"><span class="done" id="sd_${cid(cat.id)}">0</span>/${cat.tests.length}</span>
      <span class="cat-chevron">▼</span>
    </div>
    <div class="cat-body">
      <div class="cat-desc">${cat.desc}</div>
      <div class="test-list" id="tl_${cid(cat.id)}"></div>
    </div>`;
    m.appendChild(el);
    render(cat.id);
  });
}

function render(id){
  const cat=CATS.find(c=>c.id===id);
  const list=document.getElementById('tl_'+cid(id));
  if(!list) return;
  let dc=0;
  list.innerHTML=cat.tests.map((t,i)=>{
    const done=ok(id,i); if(done) dc++;
    return `<div class="test-item${done?' done':''}" onclick="toggle('${id}',${i})">
      <div class="sev-bar ${sc(t.s)}"></div>
      <div class="check-box">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
          <path d="M1 4L3.5 6.5L9 1" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="test-content">
        <div class="test-name">${t.n}</div>
        <div class="test-detail">${t.d}</div>
        <div class="test-tags">
          <span class="tag ${tc(t.s)}">${sl(t.s)}</span>
          ${t.t.map(x=>`<span class="tag t-tool">${x}</span>`).join('')}
          ${t.c.map(x=>`<span class="tag t-cwe">${x}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
  const s=document.getElementById('sd_'+cid(id));
  if(s) s.textContent=dc;
}

function prog(){
  let tot=0,dn=0;
  CATS.forEach(c=>c.tests.forEach((_,i)=>{ tot++; if(ok(c.id,i)) dn++; }));
  document.getElementById('doneCount').textContent=dn;
  document.getElementById('totalCount').textContent=tot;
  const p=tot?Math.round(dn/tot*100):0;
  document.getElementById('progressFill').style.width=p+'%';
  document.getElementById('percentText').textContent=p+'%';
}

function toggleC(id){ document.getElementById('c_'+cid(id)).classList.toggle('collapsed'); }
function expandAll(){  document.querySelectorAll('.category').forEach(c=>c.classList.remove('collapsed')); }
function collapseAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.add('collapsed')); }

function setF(id){ ['fAll','fPending','fDone'].forEach(f=>document.getElementById(f).classList.remove('active')); document.getElementById(id).classList.add('active'); }
function filterAll(){     document.querySelectorAll('.category').forEach(c=>c.classList.remove('hidden')); setF('fAll'); }
function filterPending(){ CATS.forEach(c=>{ const all=c.tests.every((_,i)=>ok(c.id,i)); document.getElementById('c_'+cid(c.id)).classList.toggle('hidden',all); }); setF('fPending'); }
function filterDone(){    CATS.forEach(c=>{ const all=c.tests.every((_,i)=>ok(c.id,i)); document.getElementById('c_'+cid(c.id)).classList.toggle('hidden',!all); }); setF('fDone'); }
function resetAll(){ if(!confirm('reset all progress?')) return; S={}; save(); build(); prog(); }

build(); prog();
</script>
