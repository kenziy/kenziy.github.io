<!DOCTYPE html>

<title>~/kenziy — WiFi Penetration Testing Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d1117; --surface:#161b22; --border:#21262d; --border2:#30363d; --green:#3fb950; --green2:rgba(63,185,80,0.12); --green-glow:0 0 8px rgba(63,185,80,0); --red:#ff3333; --yellow:#ffcc00; --cyan:#00e5ff; --gray:#444444; --text:#e6edf3; --text-dim:#8b949e; --mono:'IBM Plex Mono','Consolas','Menlo','Courier New',monospace; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.6; min-height: 100vh; }
  .navbar { border-bottom: 1px solid var(--border2); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--bg); position: sticky; top: 0; z-index: 200; }

  .nav-links a:hover { color: var(--green); }
  .header { padding: 24px 24px 18px; border-bottom: 1px solid var(--border2); }
  .header-path { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
  .header-path .hl { color: var(--green); }
  .header-title { font-size: clamp(15px, 3.5vw, 22px); color: var(--green); text-shadow: var(--green-glow); margin-bottom: 4px; }
  .header-title .prompt { color: var(--text-dim); }
  .header-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 18px; }
  .header-sub a { color: var(--cyan); text-decoration: none; }
  .header-sub a:hover { text-decoration: underline; }
  .progress-wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .progress-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .progress-label strong { color: var(--green); font-size: 16px; text-shadow: var(--green-glow); }
  .progress-track { flex: 1; min-width: 100px; max-width: 280px; height: 4px; background: var(--border2); }
  .progress-fill { height: 100%; background: var(--green); box-shadow: var(--green-glow); transition: width 0.3s ease; }
  .progress-pct { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .cursor { display: inline-block; width: 9px; height: 15px; background: var(--green); vertical-align: middle; margin-left: 3px; animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .controls { padding: 10px 24px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border2); }
  .target-input { font-family: var(--mono); font-size: 12px; padding: 5px 10px; background: var(--surface); border: 1px solid var(--border2); color: var(--green); outline: none; width: clamp(140px, 30vw, 240px); caret-color: var(--green); transition: border-color 0.12s; }
  .target-input::placeholder { color: var(--text-dim); }
  .target-input:focus { border-color: var(--green); }
  .sep { width: 1px; height: 18px; background: var(--border2); flex-shrink: 0; }
  .btn { font-family: var(--mono); font-size: 11px; padding: 5px 11px; background: transparent; border: 1px solid var(--border2); color: var(--text-dim); cursor: pointer; letter-spacing: 0.3px; transition: all 0.12s; white-space: nowrap; }
  .btn:hover { border-color: var(--green); color: var(--green); }
  .btn.active { border-color: var(--green); color: var(--green); background: var(--green2); }
  .btn.danger { color: var(--red); border-color: rgba(255,51,51,0.2); }
  .btn.danger:hover { background: rgba(255,51,51,0.07); border-color: var(--red); }
  .main { padding: 18px 24px 64px; max-width: 960px; margin: 0 auto; }
  .category { margin-bottom: 14px; border: 1px solid var(--border2); }
  .cat-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); cursor: pointer; user-select: none; transition: background 0.1s; flex-wrap: nowrap; overflow: hidden; }
  .cat-header:hover { background: #1c2128; }
  .cat-prompt { color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
  .cat-id { color: var(--green); font-size: 12px; flex-shrink: 0; text-shadow: var(--green-glow); }
  .cat-title { font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-stats { font-size: 11px; color: var(--text-dim); flex-shrink: 0; margin-left: 8px; }
  .cat-stats .done { color: var(--green); }
  .cat-chevron { color: var(--text-dim); font-size: 10px; transition: transform 0.16s; flex-shrink: 0; }
  .category.collapsed .cat-chevron { transform: rotate(-90deg); }
  .category.collapsed .cat-body { display: none; }
  .cat-desc { padding: 8px 14px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.5); line-height: 1.7; }
  .cat-desc::before { content: '# '; color: var(--border2); }
  .test-item { display: grid; grid-template-columns: 3px 18px 1fr; gap: 0 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.08s; align-items: start; }
  .test-item:last-child { border-bottom: none; }
  .test-item:hover { background: rgba(63,185,80,0.025); }
  .test-item.done { background: rgba(63,185,80,0.015); }
  .test-item.done .test-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: rgba(63,185,80,0.2); }
  .test-item.done .test-detail { opacity: 0.38; }
  .sev-bar { align-self: stretch; min-height: 16px; }
  .s-high { background: var(--red); box-shadow: 0 0 5px rgba(255,51,51,0.4); }
  .s-med { background: var(--yellow); box-shadow: 0 0 5px rgba(255,204,0,0.35); }
  .s-low { background: var(--cyan); box-shadow: 0 0 5px rgba(0,229,255,0.3); }
  .s-info { background: var(--gray); }
  .check-box { width: 14px; height: 14px; border: 1px solid var(--gray); display: flex; align-items: center; justify-content: center; margin-top: 2px; flex-shrink: 0; transition: all 0.12s; }
  .test-item:hover .check-box { border-color: var(--green); }
  .test-item.done .check-box { background: var(--green); border-color: var(--green); box-shadow: var(--green-glow); }
  .check-box svg { display: none; }
  .test-item.done .check-box svg { display: block; }
  .test-content { min-width: 0; }
  .test-name { font-size: 13px; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
  .test-name::before { content: '> '; color: var(--text-dim); }
  .test-detail { font-size: 11px; color: var(--text-dim); line-height: 1.65; margin-bottom: 6px; }
  .test-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 9px; padding: 2px 6px; border: 1px solid; letter-spacing: 0.5px; text-transform: uppercase; }
  .t-high { color: var(--red); border-color: rgba(255,51,51,0.3); background: rgba(255,51,51,0.05); }
  .t-med { color: var(--yellow); border-color: rgba(255,204,0,0.3); background: rgba(255,204,0,0.04); }
  .t-low { color: var(--cyan); border-color: rgba(0,229,255,0.25); background: rgba(0,229,255,0.04); }
  .t-tool { color: var(--green); border-color: rgba(63,185,80,0.2); background: rgba(63,185,80,0.04); }
  .t-cwe { color: #8b949e; border-color: rgba(100,100,100,0.2); background: transparent; }
  footer { text-align: center; padding: 18px 24px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border2); }
  footer a { color: var(--green); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  @media (max-width: 600px) { .navbar{padding:10px 14px} .header{padding:16px 14px 14px} .controls{padding:8px 14px} .main{padding:12px 14px 52px} .cat-header{padding:9px 12px;gap:6px} .cat-desc{padding:7px 12px} .test-item{padding:9px 12px;gap:0 10px} .test-name{font-size:12px} .btn{font-size:10px;padding:5px 8px} .target-input{width:100%} .sep{display:none} .progress-track{min-width:70px} .nav-links{gap:10px} }
  @media (max-width: 380px) { .nav-links{display:none} .header-title{font-size:13px} .cat-title{font-size:12px} }
</style>
</head>

  <div class="header-sub">
    source: <a href="https://owasp.org/www-project-web-security-testing-guide/" target="_blank">WiFi security standards</a>
    &nbsp;·&nbsp; authorized penetration testing only
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><strong id="doneCount">0</strong> / <span id="totalCount">0</span> completed</div>

<div class="controls">

  <button class="btn" onclick="collapseAll()">collapse_all</button>

  <button class="btn active" id="fAll" onclick="filterAll()">--all</button>

</div>

<script>
const CATS = [
  { id:"W01", title:"Wireless Reconnaissance",
    desc:"Passive and active wireless scanning to discover target networks, identify access points, map channels, and enumerate connected client devices.",
    tests:[
      {n:"SSID Discovery (Active/Passive)",d:"Capture beacon frames passively and send probe requests actively to discover all broadcasting and non-broadcasting wireless networks in range.",s:"low",t:["Kismet","Airodump-ng","LinSSID"],c:["CWE-200"]},
      {n:"Hidden Network Detection",d:"Identify hidden networks by capturing probe responses from clients or by sending directed probe requests. Analyze deauthentication to force reconnections.",s:"med",t:["Airodump-ng","Kismet","mdk4"],c:["CWE-200"]},
      {n:"Channel/Frequency Mapping",d:"Map all active channels (2.4GHz and 5GHz bands) to identify channel utilization, interference patterns, and optimal attack positioning.",s:"low",t:["Kismet","Airodump-ng","LinSSID"],c:["CWE-200"]},
      {n:"Client Device Enumeration",d:"Capture and catalog all wireless client devices, their MAC addresses, associated APs, signal strengths, and probe request histories.",s:"med",t:["Airodump-ng","Kismet","Wireshark"],c:["CWE-200"]},
      {n:"Signal Strength Mapping",d:"Create a heat map of wireless signal coverage to identify physical boundaries, dead zones, and areas where the network extends beyond intended perimeters.",s:"low",t:["Kismet","LinSSID","Acrylic WiFi"],c:["CWE-200"]},
      {n:"Vendor Identification via MAC OUI",d:"Identify device manufacturers from MAC address OUI prefixes to map infrastructure vendors, device types, and potential vendor-specific vulnerabilities.",s:"low",t:["Wireshark","Airodump-ng"],c:["CWE-200"]},
      {n:"Probe Request Capture and Analysis",d:"Capture client probe requests to identify previously connected networks, device types, and potential targets for evil twin attacks.",s:"med",t:["Airodump-ng","Wireshark","Kismet"],c:["CWE-200"]}
    ]
  },
  { id:"W02", title:"WPA/WPA2 Attacks",
    desc:"Attacks against WPA and WPA2 protected networks to capture handshakes, crack pre-shared keys, and exploit protocol-level vulnerabilities.",
    tests:[
      {n:"WPA2-PSK 4-Way Handshake Capture",d:"Capture the WPA2 4-way handshake by monitoring the channel and either waiting for a client reconnection or forcing deauthentication.",s:"high",t:["Airodump-ng","Aireplay-ng","hcxdumptool"],c:["CWE-328"]},
      {n:"PMKID-Based Attack",d:"Capture the PMKID from the first message of the 4-way handshake (RSN PMKID) without requiring a full handshake or client deauthentication.",s:"high",t:["hcxdumptool","hcxpcapngtool","Hashcat"],c:["CWE-328"]},
      {n:"Offline Dictionary/Brute Force Attack",d:"Crack captured WPA2 handshakes or PMKIDs using dictionary attacks, rule-based mutations, and GPU-accelerated brute force techniques.",s:"high",t:["Hashcat","Aircrack-ng","John the Ripper"],c:["CWE-521"]},
      {n:"WPS PIN Brute Force",d:"If WPS is enabled, brute-force the 8-digit PIN (effectively 11,000 combinations due to checksum) to recover the WPA/WPA2 passphrase.",s:"high",t:["Reaver","Bully","Wifite"],c:["CWE-307"]},
      {n:"WPA2-Enterprise Credential Capture",d:"Set up a rogue RADIUS server to capture enterprise credentials (username/password or certificate challenges) from connecting clients.",s:"high",t:["eaphammer","hostapd-mana","Freeradius"],c:["CWE-295"]},
      {n:"KRACK Vulnerability Test",d:"Test for Key Reinstallation Attack vulnerability by verifying if clients and APs are patched against CVE-2017-13077 through CVE-2017-13088.",s:"high",t:["krack-test","Scapy"],c:["CWE-323"]},
      {n:"Key Reinstallation Attack Verification",d:"Verify that the AP and clients properly handle message retransmissions in the 4-way handshake without resetting nonces or reinstalling keys.",s:"high",t:["krack-test","Wireshark"],c:["CWE-323"]}
    ]
  },
  { id:"W03", title:"WPA3 & Modern Protocol Testing",
    desc:"Security assessment of WPA3, SAE (Simultaneous Authentication of Equals), OWE, and other modern wireless security protocols.",
    tests:[
      {n:"WPA3-SAE Dragonfly Handshake Analysis",d:"Analyze the SAE (Dragonfly) handshake for implementation flaws, timing side-channels, and protocol downgrade vulnerabilities.",s:"high",t:["Wireshark","Scapy","wpa_supplicant"],c:["CWE-203"]},
      {n:"SAE Side-Channel Attack Testing",d:"Test for Dragonblood vulnerabilities — timing-based and cache-based side-channel attacks that may leak information about the password.",s:"high",t:["Dragonblood tools","Scapy"],c:["CWE-203"]},
      {n:"WPA3 Transition Mode Downgrade",d:"Test if WPA3 transition mode (WPA2/WPA3 mixed) can be exploited to force clients to connect using weaker WPA2 authentication.",s:"high",t:["hostapd-mana","Aircrack-ng"],c:["CWE-757"]},
      {n:"OWE (Enhanced Open) Validation",d:"Verify that Opportunistic Wireless Encryption is properly implemented on open networks, providing encrypted connections without authentication.",s:"med",t:["Wireshark","wpa_supplicant"],c:["CWE-319"]},
      {n:"PMF (Protected Management Frames) Verification",d:"Verify that 802.11w Protected Management Frames are enforced to prevent deauthentication and disassociation attacks.",s:"med",t:["Wireshark","mdk4","Aireplay-ng"],c:["CWE-345"]},
      {n:"802.11w Implementation Check",d:"Test if management frame protection can be bypassed or if the implementation has flaws that allow spoofed management frames to be accepted.",s:"med",t:["Wireshark","Scapy","mdk4"],c:["CWE-345"]}
    ]
  },
  { id:"W04", title:"Evil Twin & Rogue AP Attacks",
    desc:"Attacks using fake access points to intercept client connections, capture credentials, and perform man-in-the-middle on wireless traffic.",
    tests:[
      {n:"Evil Twin AP Creation and Testing",d:"Create a duplicate access point matching the target's SSID, BSSID, and security settings to lure clients into connecting to the rogue AP.",s:"high",t:["hostapd-mana","Fluxion","WiFi Pineapple"],c:["CWE-300"]},
      {n:"Captive Portal Credential Capture",d:"Deploy a fake captive portal on the evil twin AP that mimics the target's login page to harvest credentials from connecting users.",s:"high",t:["Fluxion","eaphammer","WiFi Pineapple"],c:["CWE-300"]},
      {n:"Karma/MANA Attack Simulation",d:"Respond to all client probe requests regardless of SSID, tricking devices into connecting to the rogue AP by impersonating previously known networks.",s:"high",t:["hostapd-mana","WiFi Pineapple","Bettercap"],c:["CWE-300"]},
      {n:"Rogue AP Detection Capabilities",d:"Test if the target organization's wireless infrastructure can detect and alert on rogue access points operating on the same or adjacent channels.",s:"med",t:["Kismet","Airodump-ng"],c:["CWE-778"]},
      {n:"Client Deauthentication Resilience",d:"Send deauth frames to force clients off the legitimate AP and test if they automatically reconnect to the stronger evil twin signal.",s:"high",t:["Aireplay-ng","mdk4"],c:["CWE-940"]},
      {n:"WIDS/WIPS Evasion Testing",d:"Test if the rogue AP can evade wireless intrusion detection/prevention systems through channel hopping, MAC spoofing, or low-power operation.",s:"med",t:["hostapd-mana","mdk4","Scapy"],c:["CWE-693"]},
      {n:"Certificate Validation Bypass",d:"In WPA2-Enterprise evil twin attacks, test if clients validate the RADIUS server certificate or blindly accept any certificate presented.",s:"high",t:["eaphammer","hostapd-mana"],c:["CWE-295"]}
    ]
  },
  { id:"W05", title:"Enterprise Wireless Testing",
    desc:"Security assessment of 802.1X, RADIUS, and EAP-based enterprise wireless authentication infrastructure.",
    tests:[
      {n:"RADIUS Server Configuration Audit",d:"Review RADIUS server configuration for weak shared secrets, supported EAP methods, certificate strength, and logging adequacy.",s:"high",t:["eaphammer","Manual"],c:["CWE-16"]},
      {n:"EAP-TLS/PEAP/TTLS Testing",d:"Test each supported EAP method for implementation weaknesses: certificate validation bypass, inner method attacks, and credential disclosure.",s:"high",t:["eaphammer","hostapd-mana","wpa_supplicant"],c:["CWE-295"]},
      {n:"Certificate Validation Bypass",d:"Test if wireless clients properly validate the RADIUS server certificate (CA, CN, expiry) or accept untrusted certificates enabling credential capture.",s:"high",t:["eaphammer","hostapd-mana"],c:["CWE-295"]},
      {n:"Inner Authentication Protocol Attack",d:"Attack inner authentication methods (MSCHAPv2, PAP, GTC) within PEAP/TTLS tunnels to capture and crack user credentials.",s:"high",t:["eaphammer","Hashcat","asleap"],c:["CWE-522"]},
      {n:"LEAP Credential Cracking",d:"If legacy LEAP authentication is supported, capture challenge/response exchanges and crack them offline to recover plaintext passwords.",s:"high",t:["asleap","Aircrack-ng"],c:["CWE-327"]},
      {n:"Eduroam-Style Federation Testing",d:"Test federated wireless authentication for realm routing issues, trust validation between institutions, and cross-realm attack vectors.",s:"med",t:["eaphammer","wpa_supplicant"],c:["CWE-284"]},
      {n:"802.1X Bypass Techniques",d:"Test for 802.1X bypass using MAC spoofing of authenticated clients, hub-based insertion, or exploiting the gap between authentication and encryption.",s:"high",t:["Scapy","macchanger","Bettercap"],c:["CWE-284"]}
    ]
  },
  { id:"W06", title:"Denial of Service Testing",
    desc:"Assessment of wireless network resilience against denial of service attacks that disrupt availability for legitimate users.",
    tests:[
      {n:"Deauthentication Flood Attack",d:"Send spoofed deauthentication frames to disconnect clients from the AP. Test if 802.11w PMF is enforced to prevent this classic wireless DoS.",s:"high",t:["Aireplay-ng","mdk4"],c:["CWE-400"]},
      {n:"Beacon Flood Attack",d:"Generate thousands of fake beacon frames to overwhelm client WiFi scanners and make it difficult to identify legitimate access points.",s:"med",t:["mdk4","Scapy"],c:["CWE-400"]},
      {n:"Authentication Flood",d:"Send a flood of authentication requests to the AP to exhaust its connection table and prevent legitimate clients from authenticating.",s:"med",t:["mdk4","Scapy"],c:["CWE-400"]},
      {n:"CTS/RTS Flood",d:"Exploit the RTS/CTS virtual carrier sense mechanism by flooding CTS frames to reserve the medium and prevent legitimate transmissions.",s:"med",t:["mdk4","Scapy"],c:["CWE-400"]},
      {n:"Channel Jamming Detection",d:"Test if the wireless infrastructure can detect and alert on sustained RF interference or jamming on operating channels.",s:"med",t:["Kismet","Manual"],c:["CWE-400"]},
      {n:"RF Interference Testing",d:"Assess the network's resilience to co-channel and adjacent-channel interference from nearby wireless networks and non-WiFi RF sources.",s:"low",t:["Kismet","LinSSID","Wireshark"],c:["CWE-400"]},
      {n:"Client Disassociation Attack",d:"Send spoofed disassociation frames to specific clients to force them offline and test automatic reconnection behavior and security posture.",s:"high",t:["Aireplay-ng","mdk4","Scapy"],c:["CWE-400"]}
    ]
  },
  { id:"W07", title:"Post-Connection Attacks",
    desc:"Attacks performed after gaining access to the wireless network to intercept traffic, escalate privileges, and move laterally into the wired network.",
    tests:[
      {n:"ARP Spoofing on Wireless Network",d:"Perform ARP spoofing on the wireless segment to intercept traffic between clients and the gateway, capturing credentials and sensitive data.",s:"high",t:["Bettercap","arpspoof","Ettercap"],c:["CWE-300"]},
      {n:"DNS Spoofing via Rogue DHCP",d:"Deploy a rogue DHCP server on the wireless network to assign attacker-controlled DNS servers, redirecting client traffic to malicious hosts.",s:"high",t:["Bettercap","Ettercap"],c:["CWE-350"]},
      {n:"Captive Portal Bypass Techniques",d:"Test methods to bypass captive portals: MAC spoofing of authenticated clients, DNS tunneling, VPN tunneling, and exploiting allowed domains.",s:"med",t:["macchanger","iodine","Bettercap"],c:["CWE-284"]},
      {n:"VLAN Hopping from Wireless",d:"Attempt to escape the wireless VLAN to access other network segments through 802.1Q tagging, DHCP option exploitation, or routing misconfigurations.",s:"high",t:["Yersinia","Scapy","Nmap"],c:["CWE-284"]},
      {n:"Wireless Traffic Sniffing",d:"Capture and analyze wireless traffic for unencrypted credentials, sensitive data, and protocol weaknesses in applications used over the wireless network.",s:"high",t:["Wireshark","tcpdump","Bettercap"],c:["CWE-319"]},
      {n:"SSL Stripping on Wireless Clients",d:"Perform SSL stripping attacks to downgrade HTTPS connections to HTTP for wireless clients, capturing credentials transmitted in cleartext.",s:"high",t:["Bettercap","sslstrip","mitmproxy"],c:["CWE-757"]},
      {n:"Lateral Movement from Wireless Segment",d:"Use the wireless network connection as a foothold to scan and attack internal wired network resources through the wireless-to-wired bridge.",s:"high",t:["Nmap","Metasploit","CrackMapExec"],c:["CWE-284"]}
    ]
  },
  { id:"W08", title:"Wireless Infrastructure Audit",
    desc:"Assessment of wireless access point hardware, management interfaces, firmware, and operational security configurations.",
    tests:[
      {n:"AP Firmware Version Check",d:"Identify firmware versions on all access points and wireless controllers. Cross-reference against CVE databases for known vulnerabilities.",s:"med",t:["Nmap","Nessus","Shodan"],c:["CWE-1035"]},
      {n:"Management Interface Security",d:"Test AP and controller management interfaces (HTTP, SSH, SNMP) for default credentials, unencrypted protocols, and unnecessary exposure.",s:"high",t:["Nmap","Hydra","curl"],c:["CWE-1392"]},
      {n:"Default Credentials on APs/Controllers",d:"Test all wireless infrastructure devices for vendor default credentials (admin/admin, admin/password) on web interfaces and management protocols.",s:"high",t:["Hydra","Nmap","Manual"],c:["CWE-1392"]},
      {n:"SNMP Community String Testing",d:"Test wireless infrastructure for SNMP with default community strings (public/private) that expose configuration details and enable remote changes.",s:"high",t:["onesixtyone","snmpwalk","Nmap"],c:["CWE-1392"]},
      {n:"Wireless IDS/IPS Effectiveness",d:"Test if WIDS/WIPS can detect common attacks: rogue APs, deauth floods, evil twins, and unauthorized clients. Verify alert generation and response.",s:"med",t:["mdk4","hostapd-mana","Kismet"],c:["CWE-778"]},
      {n:"Guest Network Isolation Verification",d:"Verify that guest wireless networks are properly isolated from corporate networks. Test for cross-VLAN access, shared resources, and routing leaks.",s:"high",t:["Nmap","Scapy","Wireshark"],c:["CWE-284"]},
      {n:"Wireless Logging and Monitoring Review",d:"Assess whether wireless events (authentication failures, rogue AP detection, deauth attacks) are logged, monitored, and trigger appropriate alerts.",s:"med",t:["Manual","Kismet"],c:["CWE-778"]}
    ]
  },
];

const SK='kenziy_wifi_pentest';
let S=JSON.parse(localStorage.getItem(SK)||'{}');
function save(){ localStorage.setItem(SK,JSON.stringify(S)); }
function ok(id,i){ return !!(S[id]&&S[id][i]); }
function toggle(id,i){ if(!S[id]) S[id]={}; S[id][i]=!S[id][i]; save(); render(id); prog(); }
function sc(s){ return s==='high'?'s-high':s==='med'?'s-med':s==='low'?'s-low':'s-info'; }
function tc(s){ return s==='high'?'t-high':s==='med'?'t-med':'t-low'; }
function sl(s){ return s==='high'?'HIGH':s==='med'?'MED':s==='low'?'LOW':'INFO'; }
function cid(id){ return id.replace(':','_'); }

function build(){
  const m=document.getElementById('main'); m.innerHTML='';
  CATS.forEach(cat=>{
    const el=document.createElement('div');
    el.className='category'; el.id='c_'+cid(cat.id);
    el.innerHTML=`<div class="cat-header" onclick="toggleC('${cat.id}')">
      <span class="cat-prompt">$</span><span class="cat-id">${cat.id}</span>
      <span class="cat-title">${cat.title}</span>
      <span class="cat-stats"><span class="done" id="sd_${cid(cat.id)}">0</span>/${cat.tests.length}</span>
      <span class="cat-chevron">▼</span></div>
    <div class="cat-body"><div class="cat-desc">${cat.desc}</div>
      <div class="test-list" id="tl_${cid(cat.id)}"></div></div>`;
    m.appendChild(el); render(cat.id);
  });
}

function render(id){
  const cat=CATS.find(c=>c.id===id);
  const list=document.getElementById('tl_'+cid(id)); if(!list) return;
  let dc=0;
  list.innerHTML=cat.tests.map((t,i)=>{
    const done=ok(id,i); if(done) dc++;
    return `<div class="test-item${done?' done':''}" onclick="toggle('${id}',${i})">
      <div class="sev-bar ${sc(t.s)}"></div>
      <div class="check-box"><svg width="10" height="8" viewBox="0 0 10 8" fill="none">
        <path d="M1 4L3.5 6.5L9 1" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="test-content"><div class="test-name">${t.n}</div><div class="test-detail">${t.d}</div>
        <div class="test-tags"><span class="tag ${tc(t.s)}">${sl(t.s)}</span>
          ${t.t.map(x=>`<span class="tag t-tool">${x}</span>`).join('')}
          ${t.c.map(x=>`<span class="tag t-cwe">${x}</span>`).join('')}</div></div></div>`;
  }).join('');
  const s=document.getElementById('sd_'+cid(id)); if(s) s.textContent=dc;
}

function prog(){
  let tot=0,dn=0;
  CATS.forEach(c=>c.tests.forEach((_,i)=>{ tot++; if(ok(c.id,i)) dn++; }));
  document.getElementById('doneCount').textContent=dn;
  document.getElementById('totalCount').textContent=tot;
  const p=tot?Math.round(dn/tot*100):0;
  document.getElementById('progressFill').style.width=p+'%';
  document.getElementById('percentText').textContent=p+'%';
}

function toggleC(id){ document.getElementById('c_'+cid(id)).classList.toggle('collapsed'); }
function expandAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.remove('collapsed')); }
function collapseAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.add('collapsed')); }
function setF(id){ ['fAll','fPending','fDone'].forEach(f=>document.getElementById(f).classList.remove('active')); document.getElementById(id).classList.add('active'); }
function filterAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.remove('hidden')); setF('fAll'); }
function filterPending(){ CATS.forEach(c=>{ const all=c.tests.every((_,i)=>ok(c.id,i)); document.getElementById('c_'+cid(c.id)).classList.toggle('hidden',all); }); setF('fPending'); }
function filterDone(){ CATS.forEach(c=>{ const all=c.tests.every((_,i)=>ok(c.id,i)); document.getElementById('c_'+cid(c.id)).classList.toggle('hidden',!all); }); setF('fDone'); }
function resetAll(){ if(!confirm('reset all progress?')) return; S={}; save(); build(); prog(); }

build(); prog();
</script>
</body>
